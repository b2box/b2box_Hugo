# Para correr la suite desde la RAÍZ del repo (`pytest` o `python -m pytest`).
# Sin esto pytest no encuentra el [tool.pytest.ini_options] de backend/pyproject.toml
# (asyncio_mode=auto) y los tests async de test_browser_fetch.py fallan.
# Los tests necesitan VENDURE_API_URL en el entorno (o un backend/.env):
#   VENDURE_API_URL=https://example.invalid/admin-api pytest
[pytest]
testpaths = backend/tests
pythonpath = backend
asyncio_mode = auto
