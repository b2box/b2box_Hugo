# ────────────────────────────────────────────────────────────────
# Hugo — B2Box Catalog QC Agent
#
# Sirve para dos casos:
#   1. Development local:  docker compose up -d --build
#   2. Coolify:            apuntá al repo, Coolify usa este mismo file.
#
# La DB ahora vive en Supabase (Postgres), por eso no hay volumen local.
# Toda la persistencia es externa al container.
# ────────────────────────────────────────────────────────────────

services:
  hugo:
    # Context = raíz del repo: el Dockerfile multi-stage necesita frontend/ y
    # backend/ para compilar React y empaquetarlo junto al backend.
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Camoufox, para leer las fichas que bloquean el fetch plano (ver
        # backend/app/ingest/browser_fetch.py). Coolify buildea con este file,
        # así que sin este arg el `--build-arg` del Dockerfile nunca llega y la
        # feature no entra a la imagen por más que se prenda la env var.
        #
        # Activarlo pide las tres cosas juntas:
        #   INSTALL_BROWSER=true         (acá, para que el binario entre)
        #   BROWSER_FETCH_ENABLED=true   (runtime, para que se use)
        #   memory: 3G                   (abajo — Firefox headless suma ~400 MB
        #                                 sobre los ~350 MB de CLIP)
        INSTALL_BROWSER: ${INSTALL_BROWSER:-false}
    image: b2box/hugo:latest
    container_name: b2box-hugo
    restart: unless-stopped

    # En Coolify, las env vars se cargan desde el panel.
    # En local, las toma de ./.env automáticamente.
    env_file:
      - .env

    # `expose` (no `ports`) → el container NO bindea al host.
    # Coolify (Traefik) enruta el dominio al puerto 8000 interno.
    # Para development local, usá: docker compose run -p 8000:8000 hugo
    # o agregá ports en un docker-compose.override.yml.
    expose:
      - "8000"

    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          # 3G, repartidos así:
          #   ~350 MB  CLIP ViT-B/32 en ONNX Runtime, cargado en este mismo
          #            proceso, más los buffers de inferencia.
          #   ~400 MB  Firefox headless por cada render de browser_fetch, solo
          #            mientras dura (5-10 s). Con 2G el container moría por OOM
          #            en el primer lookup que cayera al browser.
          #   el resto Python, el índice vectorial del catálogo y margen.
          #
          # Si BROWSER_FETCH_ENABLED queda en false, con 2G alcanza: el browser
          # nunca se levanta. Bajarlo es seguro solo en ese caso.
          #
          # Este archivo ES la fuente de verdad del límite: en Coolify la app
          # b2box-hugo usa build_pack=dockercompose apuntando acá, y sus campos
          # de Resource Limits están en 0 (sin límite). Cambiar el número en el
          # panel no hace nada; hay que tocarlo acá y redeployar.
          memory: 3G
          cpus: "1.0"
